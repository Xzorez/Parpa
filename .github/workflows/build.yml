name: Compilar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compilar
        run: dotnet build Parpa.App/Parpa.App.csproj -c Release -p:Platform=${{ matrix.platform }} -nologo
